<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" role="img" aria-label="Onyx-Gold Sequin Chiffon — draped saree, chiffon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8F2E8"/><stop offset="1" stop-color="#EFE3D0"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3C3B3F"/><stop offset="0.55" stop-color="#17161A"/><stop offset="1" stop-color="#0E0E10"/>
    </linearGradient>
    <linearGradient id="blouse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A58520"/><stop offset="1" stop-color="#6F5915"/>
    </linearGradient>
    <linearGradient id="pallu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B6B3D"/><stop offset="1" stop-color="#554618"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.12"/>
    </linearGradient>
    <pattern id="mot" width="26" height="26" patternUnits="userSpaceOnUse"><g transform="translate(8,8)"><circle r="3" fill="#C9A227"/><circle cx="-1" cy="-1" r="1" fill="#FFFFFF" opacity="0.85"/></g><g transform="translate(21,21) scale(0.8)"><circle r="3" fill="#C9A227"/><circle cx="-1" cy="-1" r="1" fill="#FFFFFF" opacity="0.85"/></g></pattern>
    <pattern id="bord" width="24" height="30" patternUnits="userSpaceOnUse"><rect x="4" y="0" width="3.5" height="30" fill="#DCC373"/><rect x="14" y="0" width="1.8" height="30" fill="#DCC373" opacity="0.75"/></pattern>
    <clipPath id="sk"><path d="M226 344 L374 344 C380 470 398 558 428 638 Q 402 656 372 644 Q 342 632 312 648 Q 282 664 252 646 Q 222 632 198 648 Q 184 656 176 640 C 204 558 220 470 226 344 Z"/></clipPath>
  </defs>

  <rect width="600" height="780" fill="url(#bg)"/>
  <ellipse cx="300" cy="716" rx="215" ry="20" fill="#000" opacity="0.10"/>

  <!-- stand -->
  <rect x="295" y="470" width="10" height="220" fill="#7D6A4F"/>
  <ellipse cx="300" cy="694" rx="74" ry="13" fill="#5C4C36"/>
  <ellipse cx="300" cy="689" rx="74" ry="12" fill="#7D6A4F"/>

  <!-- pleated skirt -->
  <g>
    <path d="M226 344 L374 344 C380 470 398 558 428 638 Q 402 656 372 644 Q 342 632 312 648 Q 282 664 252 646 Q 222 632 198 648 Q 184 656 176 640 C 204 558 220 470 226 344 Z" fill="url(#body)" stroke="#0C0B0D" stroke-opacity="0.35" stroke-width="1.5"/>
    <g clip-path="url(#sk)">
      <rect x="150" y="330" width="300" height="330" fill="url(#mot)"/>
      <path d="M234 350 L192 640" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.12"/><path d="M242 350 L200 640" fill="none" stroke="#000000" stroke-width="2" opacity="0.06"/><path d="M256 350 L228 640" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.12"/><path d="M264 350 L236 640" fill="none" stroke="#000000" stroke-width="2" opacity="0.06"/><path d="M278 350 L264 640" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.12"/><path d="M286 350 L272 640" fill="none" stroke="#000000" stroke-width="2" opacity="0.06"/><path d="M300 350 L300 640" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.12"/><path d="M308 350 L308 640" fill="none" stroke="#000000" stroke-width="2" opacity="0.06"/><path d="M322 350 L336 640" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.12"/><path d="M330 350 L344 640" fill="none" stroke="#000000" stroke-width="2" opacity="0.06"/><path d="M344 350 L372 640" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.12"/><path d="M352 350 L380 640" fill="none" stroke="#000000" stroke-width="2" opacity="0.06"/><path d="M366 350 L408 640" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.12"/><path d="M374 350 L416 640" fill="none" stroke="#000000" stroke-width="2" opacity="0.06"/>
      <rect x="150" y="604" width="300" height="6" fill="#DCC373"/>
      <rect x="150" y="610" width="300" height="52" fill="#9D7E1E"/>
      <rect x="150" y="610" width="300" height="52" fill="url(#bord)"/>
      <rect x="150" y="330" width="300" height="330" fill="url(#sheen)"/>
    </g>
  </g>

  <!-- waist belt -->
  <rect x="222" y="330" width="156" height="15" rx="7" fill="#9D7E1E"/>
  <rect x="222" y="330" width="156" height="4" rx="2" fill="#DCC373" opacity="0.9"/>

  <!-- blouse torso -->
  <path d="M262 170 C254 224 256 282 268 338 L332 338 C344 282 346 224 338 170 C318 158 282 158 262 170 Z"
        fill="url(#blouse)"/>
  <path d="M300 162 L300 338" stroke="#938250" stroke-width="2" opacity="0.5"/>
  <circle cx="300" cy="252" r="3.4" fill="#DCC373" opacity="0.9"/>

  <!-- fabric-covered neck + stand cap -->
  <rect x="291" y="124" width="18" height="46" fill="#6F5915"/>
  <circle cx="300" cy="118" r="17" fill="#7D6A4F"/>
  <circle cx="300" cy="113" r="4" fill="#5C4C36"/>

  <!-- pallu: shoulder flap, sash across chest, hanging panel -->
  <path d="M336 150 L384 170 L350 192 Z" fill="url(#pallu)"/>
  <path d="M348 158 L384 174 L334 342 L302 336 Z" fill="url(#pallu)"/>
  <path d="M348 158 L384 174" stroke="#DCC373" stroke-width="2.5" opacity="0.9"/>
  <path d="M302 336 L334 342" stroke="#DCC373" stroke-width="2.5" opacity="0.9"/>
  <path d="M302 340 L336 346 L358 648 L318 654 Z" fill="url(#pallu)"/>
  <g clip-path="url(#sk)">
    <path d="M302 340 L336 346 L358 660 L318 660 Z" fill="url(#mot)" opacity="0.9"/>
  </g>
  <path d="M336 346 L358 648" stroke="#DCC373" stroke-width="3" opacity="0.85"/>
  <path d="M302 340 L318 654" stroke="#DCC373" stroke-width="3" opacity="0.85"/>

  <!-- fabric swatch chip -->
  <g>
    <rect x="452" y="672" width="114" height="70" rx="10" fill="#FFFFFF"
          stroke="#E7DCCC" stroke-width="1.5"/>
    <rect x="460" y="680" width="58" height="54" fill="url(#body)"/>
    <rect x="460" y="680" width="58" height="54" fill="url(#mot)"/>
    <rect x="518" y="680" width="40" height="54" fill="#9D7E1E"/>
    <rect x="518" y="680" width="40" height="54" fill="url(#bord)"/>
  </g>
</svg>